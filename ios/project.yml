name: CmonYo
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: C'mon Yo!
    CMON_API_URL: ''
targets:
  CmonYo:
    type: application
    platform: iOS
    sources: [CmonYo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heznpc.cmonyo
        CODE_SIGN_ENTITLEMENTS: CmonYo/CmonYo.entitlements
    info:
      path: CmonYo/Info.plist
      properties:
        CmonAPIBaseURL: $(CMON_API_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: 현재 위치 주변의 운동 시설을 지도에 표시하기 위해 위치를 사용합니다.
        NSHealthShareUsageDescription: 건강 앱의 걸음 수를 읽어 오늘의 걷기 보상과 함께하는 원정 진행도를 반영합니다.
  CmonYoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CmonYoTests
      - path: ../contracts/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: CmonYo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heznpc.cmonyo.tests
  CmonYoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CmonYoUITests]
    dependencies:
      - target: CmonYo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heznpc.cmonyo.uitests
schemes:
  CmonYo:
    build:
      targets:
        CmonYo: all
    test:
      targets: [CmonYoTests, CmonYoUITests]
