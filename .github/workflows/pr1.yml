name: Web and contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cmon
          POSTGRES_PASSWORD: cmon
          POSTGRES_DB: cmon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cmon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cmon:cmon@127.0.0.1:5432/cmon
      TEST_DATABASE_URL: postgres://cmon:cmon@127.0.0.1:5432/cmon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run facilities -- migrate
      - run: npm run facilities -- apply contracts/samples/muan-parks.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
