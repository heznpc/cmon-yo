name: Web and contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cmon
          POSTGRES_PASSWORD: cmon
          POSTGRES_DB: cmon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cmon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cmon:cmon@127.0.0.1:5432/cmon
      TEST_DATABASE_URL: postgres://cmon:cmon@127.0.0.1:5432/cmon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run facilities -- migrate
      - run: npm run facilities -- apply contracts/samples/muan-parks.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Verify HTTPS streaming through Caddy
        shell: bash
        run: |
          mkdir -p /tmp/cmon-caddy
          cd /tmp/cmon-caddy
          curl --fail --location --retry 3 -O https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          curl --fail --location --retry 3 -O https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_checksums.txt
          sha512sum --ignore-missing --check caddy_2.11.4_checksums.txt
          tar -xzf caddy_2.11.4_linux_amd64.tar.gz caddy
          cd "$GITHUB_WORKSPACE"
          CADDY_BIN=/tmp/cmon-caddy/caddy npm run qa:https
